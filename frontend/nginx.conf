server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated -- it references the current
    # build's hashed asset filenames, so a cached stale copy would keep
    # pointing a returning browser at an old (or missing) JS/CSS bundle
    # after every redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Hashed filenames (index-<hash>.js etc.) change on every build, so these
    # are safe to cache aggressively and indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
